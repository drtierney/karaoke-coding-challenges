name: .NET Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore KaraokeCodingChallenges.slnx

      - name: Build solution
        run: dotnet build KaraokeCodingChallenges.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test KaraokeCodingChallenges.slnx --no-build --configuration Release
